name: Homepage center-column gap check

on:
  push:
    branches: [fix/home-center-column-gap]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/firefly-home-bridge.test.mjs
      - run: npm run build
