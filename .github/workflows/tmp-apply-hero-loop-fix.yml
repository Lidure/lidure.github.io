name: Temporary background loop fix

on:
  push:
    branches:
      - fix/background-video-loop-canvas

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/background-video-loop-canvas

      - name: Apply focused renderer fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hero_path = Path('src/components/HeroSlideshow.astro')
          hero = hero_path.read_text(encoding='utf-8')

          marker = "    var videoAnimFrame = null;\n"
          replacement = "    var videoAnimFrame = null;\n    var videoRenderActive = false;\n"
          if hero.count(marker) != 1:
              raise SystemExit(f'unexpected videoAnimFrame marker count: {hero.count(marker)}')
          hero = hero.replace(marker, replacement, 1)

          old = """    function renderVideoFrame() {
              if (!canvasEl || videoEl.paused || videoEl.ended) return;
              if (!drawVideoFrameOnce()) return;
              videoAnimFrame = requestAnimationFrame(renderVideoFrame);
            }

            function startVideoRender() {
              if (videoAnimFrame) cancelAnimationFrame(videoAnimFrame);
              renderVideoFrame();
            }

            function stopVideoRender() {
              if (videoAnimFrame) { cancelAnimationFrame(videoAnimFrame); videoAnimFrame = null; }
            }
          """
          new = """    function renderVideoFrame() {
              if (!videoRenderActive || !canvasEl || !videoEl) return;

              // A loop boundary can briefly report paused/ended/not-ready. Keep the
              // RAF chain alive so canvas rendering resumes with the video itself.
              if (videoEl.paused || videoEl.ended || videoEl.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                videoAnimFrame = requestAnimationFrame(renderVideoFrame);
                return;
              }

              // Stop on a real drawing failure (for example a permanently unreadable
              // canvas) instead of spinning at 60fps forever.
              if (!drawVideoFrameOnce()) {
                stopVideoRender();
                return;
              }

              videoAnimFrame = requestAnimationFrame(renderVideoFrame);
            }

            function startVideoRender() {
              stopVideoRender();
              videoRenderActive = true;
              renderVideoFrame();
            }

            function stopVideoRender() {
              videoRenderActive = false;
              if (videoAnimFrame) { cancelAnimationFrame(videoAnimFrame); videoAnimFrame = null; }
            }
          """
          if hero.count(old) != 1:
              raise SystemExit(f'unexpected renderer block count: {hero.count(old)}')
          hero = hero.replace(old, new, 1)
          hero_path.write_text(hero, encoding='utf-8')

          package_path = Path('package.json')
          package = package_path.read_text(encoding='utf-8')
          old_script = '"test:site": "node --test tests/site-build.test.mjs tests/sekai-player-search.test.mjs"'
          new_script = '"test:site": "node --test tests/site-build.test.mjs tests/sekai-player-search.test.mjs tests/hero-video-loop.test.mjs"'
          if package.count(old_script) != 1:
              raise SystemExit(f'unexpected test:site marker count: {package.count(old_script)}')
          package = package.replace(old_script, new_script, 1)
          package_path.write_text(package, encoding='utf-8')
          PY

      - name: Run focused regression test
        run: node --test tests/hero-video-loop.test.mjs

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/HeroSlideshow.astro package.json
          git commit -m "fix: keep background canvas alive across video loops"
          git push origin HEAD:fix/background-video-loop-canvas
