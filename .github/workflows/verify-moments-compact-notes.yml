name: Verify Moments Compact Notes

on:
  push:
    branches:
      - refine/moments-compact-notes

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compact note regression
        run: node --test tests/moments-compact-notes.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
