name: Verify Firefly UI Refresh

on:
  push:
    branches: [feat/firefly-ui-refresh]
    paths-ignore:
      - '.ci/firefly-ui-test-result.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify and record result
        shell: bash
        env:
          PUBLIC_MOMENTS_API: https://api.lidure22.xyz/api
          PUBLIC_MEDIA_BASE_URL: https://api.lidure22.xyz/media
          PUBLIC_METING_API: https://meting.mikus.ink/api
        run: |
          set +e
          mkdir -p .ci
          : > .ci/firefly-ui-test-result.txt

          echo '=== npm ci ===' >> .ci/firefly-ui-test-result.txt
          npm ci >> .ci/firefly-ui-test-result.txt 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            echo >> .ci/firefly-ui-test-result.txt
            echo '=== npm test ===' >> .ci/firefly-ui-test-result.txt
            npm test >> .ci/firefly-ui-test-result.txt 2>&1
            status=$?
          fi

          echo >> .ci/firefly-ui-test-result.txt
          echo "__EXIT_CODE__=$status" >> .ci/firefly-ui-test-result.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/firefly-ui-test-result.txt
          git commit -m 'ci: record Firefly UI verification result' || true
          git push origin HEAD:feat/firefly-ui-refresh

          exit "$status"
