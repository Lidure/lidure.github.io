name: Add Nekoha and Nachoneko stickers check

on:
  push:
    branches: [feat/add-nekoha-nachoneko-stickers]

permissions:
  contents: write

jobs:
  patch-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-nekoha-nachoneko-stickers
      - name: Add six sticker definitions to Worker
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('danmaku-api/src/message-stickers.ts')
          source = path.read_text()
          if "'nekoha-shizuku-wave-01'" not in source:
              needle = "  'my-melody-heart-01': { width: 88, height: 100 },\n"
              replacement = needle + """  'nekoha-shizuku-wave-01': { width: 96, height: 96 },
  'nekoha-shizuku-hug-01': { width: 96, height: 96 },
  'nekoha-shizuku-cheer-01': { width: 96, height: 96 },
  'nachoneko-love-01': { width: 94, height: 96 },
  'nachoneko-peek-01': { width: 108, height: 82 },
  'nachoneko-pizza-01': { width: 108, height: 82 },
"""
              if needle not in source:
                  raise SystemExit('Worker sticker definition anchor not found')
              source = source.replace(needle, replacement, 1)
              path.write_text(source)
          PY
      - name: Commit Worker allow-list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add danmaku-api/src/message-stickers.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: allow Nekoha and Nachoneko stickers'
          git push origin HEAD:feat/add-nekoha-nachoneko-stickers
