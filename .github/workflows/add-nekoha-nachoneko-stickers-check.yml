name: Add Nekoha and Nachoneko stickers check

on:
  push:
    branches: [feat/add-nekoha-nachoneko-stickers]

permissions:
  contents: read

jobs:
  scan-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Scan candidate sticker transparency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sticker-scan/nekoha /tmp/sticker-scan/nachoneko

          for i in $(seq 0 15); do
            curl -fsSL --retry 1 --connect-timeout 10 -A 'Mozilla/5.0 sticker-scanner' \
              "https://cdn.cdnstep.com/rzFLYl8NyFxsdUyYpcEl/${i}.webp" \
              -o "/tmp/sticker-scan/nekoha/${i}.webp" || true
          done
          for i in $(seq 0 15); do
            curl -fsSL --retry 1 --connect-timeout 10 -A 'Mozilla/5.0 sticker-scanner' \
              "https://imgcdn.sigstick.com/SWE6Ibz7eXTNFZgEdZnJ/${i}.webp" \
              -o "/tmp/sticker-scan/nachoneko/${i}.webp" || true
          done

          python <<'PY'
          from pathlib import Path
          from PIL import Image

          for pack in ('nekoha', 'nachoneko'):
              print(f'=== {pack} ===')
              for path in sorted((Path('/tmp/sticker-scan') / pack).glob('*.webp'), key=lambda p: int(p.stem)):
                  try:
                      with Image.open(path) as im:
                          rgba = im.convert('RGBA')
                          alpha = rgba.getchannel('A')
                          amin, amax = alpha.getextrema()
                          hist = alpha.histogram()
                          transparent = sum(hist[:255])
                          total = rgba.width * rgba.height
                          pct = transparent / total * 100
                          corners = [
                              alpha.getpixel((0, 0)),
                              alpha.getpixel((rgba.width - 1, 0)),
                              alpha.getpixel((0, rgba.height - 1)),
                              alpha.getpixel((rgba.width - 1, rgba.height - 1)),
                          ]
                          print(f'{path.stem}: {rgba.width}x{rgba.height} alpha={amin}-{amax} transparent={pct:.2f}% corners={corners}')
                  except Exception as exc:
                      print(f'{path.stem}: ERROR {exc}')
          PY
