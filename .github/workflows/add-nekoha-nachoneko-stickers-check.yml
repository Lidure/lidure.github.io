name: Add Nekoha and Nachoneko stickers check

on:
  push:
    branches: [feat/add-nekoha-nachoneko-stickers]

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: danmaku-api/package-lock.json
      - name: Verify Worker before deploy
        working-directory: danmaku-api
        run: |
          npm ci
          npm test
          npm run check
      - name: Deploy Worker
        working-directory: danmaku-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Smoke-test a new sticker key
        run: |
          node <<'NODE'
          const { randomUUID } = await import('node:crypto');
          const ownerToken = `smoke-${randomUUID()}-${randomUUID()}`;
          const base = 'https://api.lidure22.xyz/api/message-stickers';
          const create = await fetch(base, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'User-Agent': 'sticker-release-smoke' },
            body: JSON.stringify({
              stickerKey: 'nekoha-shizuku-wave-01',
              ownerToken,
              posX: 24,
              posY: 24,
            }),
          });
          const created = await create.json();
          if (create.status !== 201 || !created?.item?.id) {
            throw new Error(`new sticker create failed: ${create.status} ${JSON.stringify(created)}`);
          }
          const remove = await fetch(base, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'User-Agent': 'sticker-release-smoke' },
            body: JSON.stringify({ id: created.item.id, ownerToken }),
          });
          const removed = await remove.json();
          if (!remove.ok || removed?.deleted !== true) {
            throw new Error(`smoke sticker cleanup failed: ${remove.status} ${JSON.stringify(removed)}`);
          }
          console.log(`production accepted and removed ${created.item.stickerKey}`);
          NODE
