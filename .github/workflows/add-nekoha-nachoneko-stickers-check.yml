name: Add Nekoha and Nachoneko stickers check

on:
  push:
    branches: [feat/add-nekoha-nachoneko-stickers]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install pillow
      - name: Run public sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
      - name: Verify new sticker PNG transparency
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          keys = [
              'nekoha-shizuku-wave-01',
              'nekoha-shizuku-hug-01',
              'nekoha-shizuku-cheer-01',
              'nachoneko-love-01',
              'nachoneko-peek-01',
              'nachoneko-pizza-01',
          ]
          for key in keys:
              path = Path('public/assets/message-stickers') / f'{key}.png'
              with Image.open(path) as im:
                  rgba = im.convert('RGBA')
                  alpha = rgba.getchannel('A')
                  amin, amax = alpha.getextrema()
                  hist = alpha.histogram()
                  transparent_pct = sum(hist[:255]) / (rgba.width * rgba.height) * 100
                  corners = [
                      alpha.getpixel((0, 0)),
                      alpha.getpixel((rgba.width - 1, 0)),
                      alpha.getpixel((0, rgba.height - 1)),
                      alpha.getpixel((rgba.width - 1, rgba.height - 1)),
                  ]
                  assert amin < 255, f'{key}: no transparent pixels'
                  assert transparent_pct >= 5, f'{key}: transparent area too small: {transparent_pct:.2f}%'
                  assert sum(value < 255 for value in corners) >= 3, f'{key}: opaque corners {corners}'
                  print(f'{key}: {rgba.width}x{rgba.height}, transparent={transparent_pct:.2f}%')
          PY
      - name: Run full site regression and build
        run: npm test
      - name: Run Worker tests and typecheck
        run: |
          cd danmaku-api
          npm ci
          npm test
          npm run check
