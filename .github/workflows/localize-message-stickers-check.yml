name: Localize message stickers check

on:
  push:
    branches: [perf/localize-message-stickers]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
      - name: Verify local PNG payloads
        run: |
          node <<'NODE'
          const fs = await import('node:fs/promises');
          const path = await import('node:path');
          const dir = 'public/assets/message-stickers';
          const files = (await fs.readdir(dir)).filter((name) => name.endsWith('.png')).sort();
          if (files.length !== 12) throw new Error(`expected 12 PNG assets, got ${files.length}`);
          const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          for (const name of files) {
            const bytes = await fs.readFile(path.join(dir, name));
            if (bytes.length < 1024) throw new Error(`${name}: suspiciously small (${bytes.length} bytes)`);
            if (!bytes.subarray(0, 8).equals(signature)) throw new Error(`${name}: invalid PNG signature`);
            console.log(`${name}: ${bytes.length} bytes`);
          }
          NODE
      - name: Run full site regression and build
        run: npm test
