name: Remove legacy board stickers check

on:
  push:
    branches: [fix/remove-legacy-board-stickers]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run removal contract
        run: node --test tests/message-board-legacy-stickers-removed.test.mjs
