name: Gallery Fallback Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Gallery page fill and failure fallback in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/gallery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID ${CHROME_PID:-} 2>/dev/null || true' EXIT

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/gallery-chrome.log 2>&1 &
          CHROME_PID=$!

          cat > /tmp/gallery-fallback-check.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let i = 0; i < 40; i++) {
            try {
              const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
              if (targets.some(target => target.webSocketDebuggerUrl)) break;
            } catch {}
            await sleep(250);
          }

          const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
          const target = targets.find(item => item.type === 'page' && item.webSocketDebuggerUrl);
          if (!target) throw new Error('No Chrome page target');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let seq = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const slot = pending.get(message.id);
            if (!slot) return;
            pending.delete(message.id);
            if (message.error) slot.reject(new Error(JSON.stringify(message.error)));
            else slot.resolve(message.result);
          });

          function send(method, params = {}) {
            const id = ++seq;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
          }

          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(JSON.stringify(result.exceptionDetails));
            return result.result.value;
          }

          async function setViewport(width, height = 1000, mobile = false) {
            await send('Emulation.setDeviceMetricsOverride', { width, height, deviceScaleFactor: 1, mobile });
            await sleep(350);
          }

          async function probe(label) {
            const result = await evaluate(`(() => {
              const grid = document.querySelector('#gallery-grid');
              const columns = grid ? getComputedStyle(grid).gridTemplateColumns : '';
              return {
                width: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                cards: document.querySelectorAll('.gallery-tile').length,
                columns: columns ? columns.split(/\\s+/).length : 0,
              };
            })()`);
            console.log(label, JSON.stringify(result));
            if (result.scrollWidth > result.width + 1) throw new Error(`${label}: horizontal overflow`);
            return result;
          }

          await send('Page.enable');
          await send('Runtime.enable');
          await setViewport(1440, 1200, false);
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/gallery/' });

          for (let i = 0; i < 80; i++) {
            const ready = await evaluate(`(() => ({
              categories: document.querySelectorAll('.gallery-category-tab').length,
              cards: document.querySelectorAll('.gallery-tile').length,
            }))()`);
            if (ready.categories > 1 && ready.cards > 0) break;
            await sleep(250);
          }

          const selected = await evaluate(`(() => {
            const tabs = [...document.querySelectorAll('.gallery-category-tab')];
            const target = tabs.find(tab => {
              const match = tab.textContent.match(/·\\s*(\\d+)\\s*$/);
              return match && Number(match[1]) >= 25;
            });
            if (!target) return false;
            target.click();
            return true;
          })()`);
          if (!selected) throw new Error('No Gallery category with at least 25 images');
          await sleep(250);

          const desktop = await probe('desktop');
          if (desktop.columns !== 5 || desktop.cards !== 25) {
            throw new Error(`desktop: expected 5 columns / 25 cards, got ${desktop.columns} / ${desktop.cards}`);
          }

          const fallback = await evaluate(`(() => {
            const card = document.querySelector('.gallery-tile');
            const image = card?.querySelector('img');
            if (!card || !image) return null;
            image.dispatchEvent(new Event('error'));
            image.dispatchEvent(new Event('error'));
            const panel = card.querySelector('.gallery-tile-fallback');
            return {
              error: card.classList.contains('is-error'),
              imageHidden: image.hidden,
              fallbackVisible: !!panel && !panel.hidden,
              title: panel?.querySelector('.gallery-tile-fallback-title')?.textContent || '',
              filename: panel?.querySelector('.gallery-tile-fallback-filename')?.textContent || '',
              hint: panel?.querySelector('.gallery-tile-fallback-hint')?.textContent || '',
            };
          })()`);
          console.log('fallback', JSON.stringify(fallback));
          if (!fallback?.error || !fallback.imageHidden || !fallback.fallbackVisible) throw new Error('failure fallback did not replace the broken image');
          if (fallback.title !== '暂时无法加载' || !fallback.filename || fallback.hint !== '点击重试') throw new Error('failure fallback copy is incomplete');

          const manualRetry = await evaluate(`(() => {
            const card = document.querySelector('.gallery-tile.is-error');
            card?.click();
            return {
              retrying: !!card?.classList.contains('is-retrying'),
              title: card?.querySelector('.gallery-tile-fallback-title')?.textContent || '',
            };
          })()`);
          if (!manualRetry.retrying || manualRetry.title !== '正在重新加载…') throw new Error('manual retry state did not activate');

          await setViewport(1000, 1000, false);
          const fourColumns = await probe('four-columns');
          if (fourColumns.columns !== 4 || fourColumns.cards !== 24) throw new Error('four-column layout is not filled with 24 cards');

          await setViewport(800, 1000, false);
          const threeColumns = await probe('three-columns');
          if (threeColumns.columns !== 3 || threeColumns.cards !== 24) throw new Error('three-column layout is not filled with 24 cards');

          await setViewport(390, 844, true);
          const mobile = await probe('mobile');
          if (mobile.columns !== 2 || mobile.cards !== 24) throw new Error('mobile two-column layout is not filled with 24 cards');

          ws.close();
          NODE

          node /tmp/gallery-fallback-check.mjs
