name: Sticker categories RED

on:
  push:
    branches: [feat/sticker-categories-layering-expansion]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
