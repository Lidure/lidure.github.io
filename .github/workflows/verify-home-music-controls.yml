name: Verify home music controls

on:
  push:
    branches: [fix/home-music-controls]
    paths-ignore:
      - '.ci/home-music-controls-result.txt'

permissions:
  contents: write

concurrency:
  group: verify-home-music-controls
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-music-controls
          fetch-depth: 0
      - name: Add SEKAI player public open API exactly once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/SekaiPlayer.astro')
          text = path.read_text(encoding='utf-8')
          marker = 'window.__sekaiOpenPlayer = function'
          old = (
              "  function togglePanel() {\n"
              "    panel.classList.toggle('hidden');\n"
              "    if (!panel.classList.contains('hidden')) ensureCatalog().catch(function() {});\n"
              "  }\n"
          )
          new = (
              "  function openPanel() {\n"
              "    panel.classList.remove('hidden');\n"
              "    ensureCatalog().catch(function() {});\n"
              "  }\n"
              "\n"
              "  function togglePanel() {\n"
              "    if (panel.classList.contains('hidden')) openPanel();\n"
              "    else panel.classList.add('hidden');\n"
              "  }\n"
              "\n"
              "  window.__sekaiOpenPlayer = function() {\n"
              "    openPanel();\n"
              "  };\n"
          )
          if marker in text:
              print('SEKAI player public open API already present')
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Patched SEKAI player public open API')
          else:
              raise SystemExit(f'Expected exactly one togglePanel block, found {text.count(old)}')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests and record result
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          {
            echo '=== npm test ==='
            npm test
            code=$?
            echo
            echo "__EXIT_CODE__=$code"
            exit "$code"
          } > .ci/home-music-controls-result.txt 2>&1
        continue-on-error: true
      - name: Commit source patch and result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SekaiPlayer.astro .ci/home-music-controls-result.txt
          git commit -m 'fix: expose SEKAI player open API and verify' || exit 0
          git pull --rebase origin fix/home-music-controls
          git push origin HEAD:fix/home-music-controls
