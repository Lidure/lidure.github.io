name: Verify Exact Sayori Shell

on:
  push:
    branches:
      - fix/exact-sayori-reading-shell

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Focused Sayori shell contract
        run: node --test tests/article-scroll-performance.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
