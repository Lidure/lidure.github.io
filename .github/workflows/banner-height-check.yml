name: Banner height check

on:
  push:
    branches: [feat/banner-height-setting]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/banner-height-settings.test.mjs tests/visual-settings.test.mjs tests/firefly-banner-surface.test.mjs tests/firefly-wallpaper-modes.test.mjs
      - run: npm run build
