name: Hero placeholder check

on:
  push:
    branches: [fix/quiet-background-placeholder]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply quiet fallback fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/HeroSlideshow.astro')
          source = path.read_text(encoding='utf-8')
          old = """    if (!posterNeededEl) {
              posterNeededEl = document.createElement('div');
              posterNeededEl.className = 'poster-needed-placeholder';
              posterNeededEl.setAttribute('aria-hidden', 'true');
              posterNeededEl.textContent = 'VIDEO_CORS_REQUIRED · needs-poster';
              container.appendChild(posterNeededEl);
            }
          """
          new = """    if (!posterNeededEl) {
              posterNeededEl = document.createElement('div');
              posterNeededEl.className = 'poster-needed-placeholder';
              container.appendChild(posterNeededEl);
            }
            posterNeededEl.setAttribute('aria-hidden', 'true');
            posterNeededEl.textContent = '';
          """
          if old not in source:
              raise SystemExit('expected hero placeholder block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Run placeholder regression
        run: node --test tests/hero-background-placeholder.test.mjs
      - name: Build site
        run: npm run build
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HeroSlideshow.astro
          git commit -m "fix: hide internal hero fallback status"
          git push
