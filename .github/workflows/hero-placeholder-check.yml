name: Hero placeholder check

on:
  push:
    branches: [fix/quiet-background-placeholder]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run placeholder regression
        run: node --test tests/hero-background-placeholder.test.mjs
