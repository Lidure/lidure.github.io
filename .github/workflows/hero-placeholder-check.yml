name: Hero placeholder check

on:
  push:
    branches: [fix/quiet-background-placeholder]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply quiet fallback fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/HeroSlideshow.astro')
          source = path.read_text(encoding='utf-8')
          debug_line = "      posterNeededEl.textContent = 'VIDEO_CORS_REQUIRED · needs-poster';\n"
          append_line = "      container.appendChild(posterNeededEl);\n    }\n"
          if debug_line not in source:
              raise SystemExit('expected hero debug text not found')
          if append_line not in source:
              raise SystemExit('expected hero placeholder append block not found')
          source = source.replace(debug_line, '', 1)
          source = source.replace(
              append_line,
              append_line + "    posterNeededEl.setAttribute('aria-hidden', 'true');\n    posterNeededEl.textContent = '';\n",
              1,
          )
          path.write_text(source, encoding='utf-8')
      - name: Run placeholder regression
        run: node --test tests/hero-background-placeholder.test.mjs
      - name: Build site
        run: npm run build
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HeroSlideshow.astro
          git commit -m "fix: hide internal hero fallback status"
          git push
