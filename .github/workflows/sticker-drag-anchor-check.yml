name: Sticker drag anchor check

on:
  push:
    branches: [fix/sticker-drag-anchor]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run sticker regressions
        run: node --test tests/message-board-sticker-layout.test.mjs tests/message-board-page.test.mjs
      - name: Build site
        run: npm run build
