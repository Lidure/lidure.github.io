name: Sekai multi-playlist edge check

on:
  push:
    branches: [feat/multi-import-playlists]

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip playlist-edge-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch edge cases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/SekaiPlayer.astro')
          s = p.read_text(encoding='utf-8')
          old_apply = "  function applyFilters() {\n    var normalizedQuery = normalize(query);"
          new_apply = "  function applyFilters() {\n    if (activeImportedPlaylist !== 'all' && !songs.some(function(song) { return song.playlistKey === activeImportedPlaylist; })) {\n      activeImportedPlaylist = 'all';\n    }\n    var normalizedQuery = normalize(query);"
          if old_apply not in s:
              raise SystemExit('applyFilters anchor not found')
          s = s.replace(old_apply, new_apply, 1)
          old_name = "    var platformName = platform === 'netease' ? '网易云' : 'QQ音乐';\n    var resolvedName = playlistName || (platformName + '歌单 · ' + playlistId);\n    var existed = songs.some(function(s) { return s.playlistKey === playlistKey; });"
          new_name = "    var platformName = platform === 'netease' ? '网易云' : 'QQ音乐';\n    var previousPlaylist = songs.find(function(s) { return s.playlistKey === playlistKey; });\n    var resolvedName = playlistName || (previousPlaylist && previousPlaylist.playlistName) || (platformName + '歌单 · ' + playlistId);\n    var existed = !!previousPlaylist;"
          if old_name not in s:
              raise SystemExit('playlist name anchor not found')
          s = s.replace(old_name, new_name, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - run: node --test tests/sekai-multi-playlists.test.mjs
      - run: npm run build
      - name: Commit verified edge fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SekaiPlayer.astro
          git commit -m "fix: harden imported playlist switching [skip playlist-edge-ci]"
          git push
