name: Sekai multi-playlist edge check

on:
  push:
    branches: [feat/multi-import-playlists]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/sekai-multi-playlists.test.mjs
