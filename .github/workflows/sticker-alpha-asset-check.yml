name: Sticker alpha asset check

on:
  push:
    branches: [fix/message-sticker-transparency]

permissions:
  contents: read

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify every sticker asset is reachable and transparent
        run: |
          node <<'NODE'
          const fs = await import('node:fs/promises');
          const source = await fs.readFile('src/lib/message-sticker-catalog.ts', 'utf8');
          const urls = [...source.matchAll(/imageUrl:\s*'([^']+)'/g)].map((m) => m[1]);
          if (urls.length !== 12) throw new Error(`expected 12 assets, got ${urls.length}`);

          function pngHasTransparency(bytes) {
            const sig = [137,80,78,71,13,10,26,10];
            if (bytes.length < 33 || !sig.every((v, i) => bytes[i] === v)) return false;
            const colorType = bytes[25];
            if (colorType === 4 || colorType === 6) return true;
            let offset = 8;
            while (offset + 12 <= bytes.length) {
              const length = bytes.readUInt32BE(offset);
              const type = bytes.toString('ascii', offset + 4, offset + 8);
              if (type === 'tRNS') return true;
              offset += 12 + length;
            }
            return false;
          }

          for (const url of urls) {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: { 'User-Agent': 'Mozilla/5.0 sticker-alpha-check' },
            });
            if (!response.ok) throw new Error(`${url} returned ${response.status}`);
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.startsWith('image/')) throw new Error(`${url} returned ${contentType}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!pngHasTransparency(bytes)) throw new Error(`${url} is not a transparent PNG`);
            console.log(`transparent: ${url}`);
          }
          NODE
