name: Moments legacy image fallback

on:
  push:
    branches: [fix/legacy-moment-image-fallback]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run legacy image regression
        run: node --test tests/moments-legacy-image-fallback.test.mjs tests/moments-journal-layout.test.mjs
      - name: Build site
        run: npm run build
