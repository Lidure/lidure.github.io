name: Local wallpapers RED

on:
  push:
    branches: [perf/localize-default-wallpapers]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/native-wallpaper-image.test.mjs
