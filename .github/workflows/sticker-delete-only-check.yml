name: Sticker delete-only check

on:
  push:
    branches: [fix/sticker-delete-only-actions]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sticker-delete-only-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove redundant drag hint
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/lib/message-sticker-controller.ts')
          source = path.read_text()
          old = """    const hint = document.createElement('button');
    hint.type = 'button';
    hint.textContent = '拖动整理';
    hint.addEventListener('pointerdown', (event) => event.stopPropagation());
    hint.addEventListener('click', (event) => { event.stopPropagation(); }, { signal });
"""
          if old not in source:
              raise SystemExit('drag hint block not found')
          source = source.replace(old, '', 1)
          source = source.replace('    actions.append(hint, remove);', '    actions.append(remove);', 1)
          source = source.replace('`${definition.character}公共贴纸，可点击管理或拖动`', '`${definition.character}公共贴纸，可点击删除或直接拖动`', 1)
          path.write_text(source)
          PY
      - name: Commit production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/message-sticker-controller.ts
          git commit -m 'fix: simplify sticker actions to delete only'
          git push origin HEAD:fix/sticker-delete-only-actions
      - name: Install dependencies
        run: npm ci
      - name: Run sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
      - name: Run full site regression
        run: npm test
