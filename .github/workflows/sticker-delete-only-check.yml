name: Sticker delete-only check

on:
  push:
    branches: [fix/sticker-delete-only-actions]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sticker-delete-only-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove redundant drag hint
        run: |
          perl -0pi -e "s/    const hint = document\.createElement\('button'\);\n    hint\.type = 'button';\n    hint\.textContent = '拖动整理';\n    hint\.addEventListener\('pointerdown', \(event\) => event\.stopPropagation\(\)\);\n    hint\.addEventListener\('click', \(event\) => \{ event\.stopPropagation\(\); \}, \{ signal \}\);\n//" src/lib/message-sticker-controller.ts
          perl -pi -e "s/actions\.append\(hint, remove\);/actions.append(remove);/" src/lib/message-sticker-controller.ts
          perl -pi -e "s/可点击管理或拖动/可点击删除或直接拖动/" src/lib/message-sticker-controller.ts
          grep -q "remove.textContent = '删除'" src/lib/message-sticker-controller.ts
          ! grep -q "拖动整理" src/lib/message-sticker-controller.ts
      - name: Commit production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/message-sticker-controller.ts
          git commit -m 'fix: simplify sticker actions to delete only'
          git push origin HEAD:fix/sticker-delete-only-actions
      - name: Install dependencies
        run: npm ci
      - name: Run sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
      - name: Run full site regression
        run: npm test
