name: V3 Task6 Test Migration

on:
  push:
    branches:
      - feat/firefly-banner-covers-music
    paths:
      - .github/workflows/v3-task6-patch.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/firefly-banner-covers-music
          fetch-depth: 0

      - name: Update legacy sakura tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/site-build.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = r'''test('layout mounts the sakura particle layer and uses visible flower glyphs', () => {
            const layout = readSource('src/layouts/BaseLayout.astro');
            const particles = readSource('src/components/SekaiParticles.astro');

            assert.match(layout, /import SekaiParticles from ['"]\.\.\/components\/SekaiParticles\.astro['"]/);
            assert.match(layout, /<SekaiParticles\s*\/>/);
            assert.match(particles, /var emojis = \['🌸'/);
            assert.match(particles, /'🌺'\]/);
          });

          test('sakura particles use the approved flowers and natural drift parameters', () => {
            const particles = readSource('src/components/SekaiParticles.astro');

            assert.match(particles, /var emojis = \['\\u\{1F338\}', '\\u\{1F4AE\}', '❀'\]/);
            assert.match(particles, /windAmplitude/);
            assert.match(particles, /rotateStart/);
            assert.match(particles, /MAX_PETALS = 24/);
          });'''
          new = r'''test('layout mounts the canvas sakura particle layer', () => {
            const layout = readSource('src/layouts/BaseLayout.astro');
            const particles = readSource('src/components/SekaiParticles.astro');

            assert.match(layout, /import SekaiParticles from ['"]\.\.\/components\/SekaiParticles\.astro['"]/);
            assert.match(layout, /<SekaiParticles\s*\/>/);
            assert.match(particles, /<canvas[^>]*id="sakura-canvas"/);
            assert.match(particles, /transferControlToOffscreen/);
          });

          test('sakura particles use drawn petal drift with a worker fallback', () => {
            const particles = readSource('src/components/SekaiParticles.astro');
            const worker = readSource('src/workers/sakura.worker.js');

            assert.match(worker, /MAX_PETALS = 24/);
            assert.match(worker, /bezierCurveTo/);
            assert.match(worker, /wind/);
            assert.match(worker, /sway/);
            assert.match(particles, /getContext\(['"]2d['"]\)/);
            assert.match(particles, /prefers-reduced-motion/);
          });'''

          if old not in text:
              raise SystemExit('legacy sakura test block not found exactly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        env:
          PUBLIC_MOMENTS_API: https://api.lidure22.xyz/api
          PUBLIC_MEDIA_BASE_URL: https://api.lidure22.xyz/media
        run: npm test

      - name: Commit migrated tests and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3-task6-patch.yml
          git add tests/site-build.test.mjs
          git commit -m "test: migrate sakura assertions to canvas worker"
          git push origin HEAD:feat/firefly-banner-covers-music
