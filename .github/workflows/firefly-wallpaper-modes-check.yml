name: Firefly wallpaper modes check

on:
  push:
    branches: [feat/firefly-wallpaper-modes]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply wallpaper mode patches
        run: python scripts/apply-firefly-wallpaper-modes.py
      - run: node --test tests/firefly-wallpaper-modes.test.mjs
      - run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "lidure"
          git config user.email "101858375+Lidure@users.noreply.github.com"
          git add src/layouts/BaseLayout.astro src/components/VisualSettingsPanel.astro
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "feat: add Firefly wallpaper presentation modes"
            git push origin HEAD:feat/firefly-wallpaper-modes
          fi
