name: Banner Wave Layer Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify dialog paints above banner waves in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/banner-wave-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID ${CHROME_PID:-} 2>/dev/null || true' EXIT

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/banner-wave-chrome.log 2>&1 &
          CHROME_PID=$!

          cat > /tmp/banner-wave-check.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let i = 0; i < 40; i++) {
            try {
              const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
              if (targets.some(target => target.webSocketDebuggerUrl)) break;
            } catch {}
            await sleep(250);
          }

          const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
          const target = targets.find(item => item.type === 'page' && item.webSocketDebuggerUrl);
          if (!target) throw new Error('No Chrome page target');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let seq = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const slot = pending.get(message.id);
            if (!slot) return;
            pending.delete(message.id);
            if (message.error) slot.reject(new Error(JSON.stringify(message.error)));
            else slot.resolve(message.result);
          });

          function send(method, params = {}) {
            const id = ++seq;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
          }

          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(JSON.stringify(result.exceptionDetails));
            return result.result.value;
          }

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Emulation.setDeviceMetricsOverride', { width: 1600, height: 900, deviceScaleFactor: 1, mobile: false });
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/gallery/manage/' });
          await sleep(900);

          const result = await evaluate(`(async () => {
            const stage = document.querySelector('.blog-banner-stage');
            const surface = document.querySelector('.standard-page-surface');
            const wave = document.querySelector('.banner-waves');
            const connect = document.querySelector('#gallery-manage-connect');
            const dialog = document.querySelector('#gallery-manage-dialog');
            if (!stage || !surface || !wave || !connect || !dialog) {
              return { error: 'required Gallery stacking nodes are missing' };
            }

            connect.click();
            await new Promise(resolve => setTimeout(resolve, 150));
            if (dialog.hidden) return { error: 'connection dialog did not open' };

            wave.style.setProperty('pointer-events', 'auto', 'important');
            const rect = wave.getBoundingClientRect();
            const x = Math.max(1, Math.min(window.innerWidth - 2, rect.left + rect.width / 2));
            const y = Math.max(1, Math.min(window.innerHeight - 2, rect.top + rect.height / 2));
            const top = document.elementFromPoint(x, y);

            return {
              stageZ: getComputedStyle(stage).zIndex,
              surfaceZ: getComputedStyle(surface).zIndex,
              dialogZ: getComputedStyle(dialog).zIndex,
              waveTop: rect.top,
              waveBottom: rect.bottom,
              point: [x, y],
              topId: top?.id || '',
              topClass: top?.className || '',
              topInsideDialog: Boolean(top?.closest?.('#gallery-manage-dialog')),
            };
          })()`);

          console.log('banner-wave-layering', JSON.stringify(result));
          if (result?.error) throw new Error(result.error);
          if (!(Number(result.stageZ) < Number(result.surfaceZ))) {
            throw new Error(`banner stage must stay below page surface: ${result.stageZ} !< ${result.surfaceZ}`);
          }
          if (!result.topInsideDialog) {
            throw new Error(`dialog is not the painted top layer over the wave region: ${JSON.stringify(result)}`);
          }

          ws.close();
          NODE

          node /tmp/banner-wave-check.mjs
