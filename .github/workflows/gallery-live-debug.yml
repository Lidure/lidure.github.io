name: Gallery Live Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect gallery grid placement
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/gallery-debug-profile \
            --window-size=1440,1600 https://lidure22.xyz/gallery/ >/tmp/gallery-cdp.log 2>&1 &
          chrome_pid=$!
          trap 'kill $chrome_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break
            sleep 1
          done
          sleep 8
          node <<'NODE'
          const pages = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page = pages.find((p) => p.url.includes('/gallery')) || pages[0];
          if (!page?.webSocketDebuggerUrl) throw new Error('No debuggable page');
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          function call(method, params = {}) {
            const callId = ++id;
            return new Promise((resolve, reject) => {
              const handler = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.id !== callId) return;
                ws.removeEventListener('message', handler);
                if (msg.error) reject(new Error(JSON.stringify(msg.error)));
                else resolve(msg.result);
              };
              ws.addEventListener('message', handler);
              ws.send(JSON.stringify({ id: callId, method, params }));
            });
          }
          await call('Runtime.enable');
          const expression = `(() => {
            const parent = document.querySelector('.standard-content');
            if (!parent) return { error: 'standard-content not found' };
            const ps = getComputedStyle(parent);
            const children = [...parent.children].map((el, index) => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return {
                index,
                tag: el.tagName,
                id: el.id,
                className: typeof el.className === 'string' ? el.className : '',
                display: s.display,
                position: s.position,
                gridColumnStart: s.gridColumnStart,
                gridColumnEnd: s.gridColumnEnd,
                gridRowStart: s.gridRowStart,
                gridRowEnd: s.gridRowEnd,
                justifySelf: s.justifySelf,
                alignSelf: s.alignSelf,
                order: s.order,
                marginLeft: s.marginLeft,
                marginRight: s.marginRight,
                x: r.x,
                y: r.y,
                width: r.width,
                height: r.height
              };
            });
            const shell = document.querySelector('.gallery-page-shell');
            const ss = shell ? getComputedStyle(shell) : null;
            return {
              parentGrid: {
                display: ps.display,
                gridTemplateColumns: ps.gridTemplateColumns,
                gridTemplateRows: ps.gridTemplateRows,
                gridAutoColumns: ps.gridAutoColumns,
                gridAutoRows: ps.gridAutoRows,
                gridAutoFlow: ps.gridAutoFlow,
                justifyContent: ps.justifyContent,
                justifyItems: ps.justifyItems,
                alignItems: ps.alignItems,
                columnGap: ps.columnGap,
                rowGap: ps.rowGap
              },
              children,
              shell: ss ? {
                gridColumnStart: ss.gridColumnStart,
                gridColumnEnd: ss.gridColumnEnd,
                gridRowStart: ss.gridRowStart,
                gridRowEnd: ss.gridRowEnd,
                justifySelf: ss.justifySelf,
                alignSelf: ss.alignSelf,
                order: ss.order,
                marginLeft: ss.marginLeft,
                marginRight: ss.marginRight
              } : null
            };
          })()`;
          const result = await call('Runtime.evaluate', { expression, returnByValue: true });
          console.log(JSON.stringify(result.result.value, null, 2));
          ws.close();
          NODE
