name: Gallery Live Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live response headers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== gallery headers ==='
          curl -fsSI --retry 3 --retry-delay 2 https://lidure22.xyz/gallery/ | tr -d '\r'
          echo '=== manifest headers ==='
          curl -fsSI --retry 3 --retry-delay 2 https://raw.githubusercontent.com/Lidure/airi-gallery-images/main/gallery/gallery_index.json | tr -d '\r'

      - name: Render live Gallery in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome=$CHROME"
          set +e
          timeout 40s "$CHROME" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom \
            https://lidure22.xyz/gallery/ > /tmp/gallery-dom.html 2> /tmp/gallery-chrome.log
          chrome_status=$?
          timeout 40s "$CHROME" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --window-size=1440,1600 \
            --screenshot=/tmp/gallery-live.png \
            https://lidure22.xyz/gallery/ >> /tmp/gallery-chrome.log 2>&1
          screenshot_status=$?
          set -e
          echo "chrome_status=$chrome_status screenshot_status=$screenshot_status"
          echo '=== rendered counts ==='
          printf 'category tabs: '; grep -o 'gallery-category-tab' /tmp/gallery-dom.html | wc -l || true
          printf 'gallery tiles: '; grep -o 'gallery-tile' /tmp/gallery-dom.html | wc -l || true
          echo '=== gallery notice ==='
          grep -o '<div id="gallery-notice"[^>]*>[^<]*' /tmp/gallery-dom.html || true
          echo '=== gallery root excerpt ==='
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/gallery-dom.html').read_text(errors='replace')
          start = html.find('id="gallery-browser-root"')
          print(html[max(0, start-300):start+5000] if start >= 0 else 'gallery root not found')
          PY
          echo '=== Chrome console/errors ==='
          grep -Ei 'CONSOLE|ERROR|failed|blocked|cors|refused' /tmp/gallery-chrome.log | tail -120 || true

      - name: Inspect computed layout via DevTools
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/gallery-debug-profile \
            --window-size=1440,1600 https://lidure22.xyz/gallery/ >/tmp/gallery-cdp.log 2>&1 &
          chrome_pid=$!
          trap 'kill $chrome_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break
            sleep 1
          done
          sleep 8
          node <<'NODE'
          const pages = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page = pages.find((p) => p.url.includes('/gallery')) || pages[0];
          if (!page?.webSocketDebuggerUrl) throw new Error('No debuggable page');
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          function call(method, params = {}) {
            const callId = ++id;
            return new Promise((resolve, reject) => {
              const handler = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.id !== callId) return;
                ws.removeEventListener('message', handler);
                if (msg.error) reject(new Error(JSON.stringify(msg.error)));
                else resolve(msg.result);
              };
              ws.addEventListener('message', handler);
              ws.send(JSON.stringify({ id: callId, method, params }));
            });
          }
          await call('Runtime.enable');
          const expression = `(() => {
            const pick = (sel) => {
              const el = document.querySelector(sel);
              if (!el) return null;
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return {
                selector: sel,
                rect: {x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,bottom:r.bottom},
                display:s.display, visibility:s.visibility, opacity:s.opacity,
                position:s.position, zIndex:s.zIndex, overflow:s.overflow,
                color:s.color, background:s.backgroundColor,
                transform:s.transform
              };
            };
            return {
              viewport:{w:innerWidth,h:innerHeight,scrollY,scrollHeight:document.documentElement.scrollHeight},
              html:{classes:document.documentElement.className,wallpaper:document.documentElement.dataset.wallpaperMode},
              body:{classes:document.body.className},
              banner:pick('.blog-banner-stage'),
              surface:pick('.standard-page-surface'),
              content:pick('.standard-content'),
              shell:pick('.gallery-page-shell'),
              browser:pick('#gallery-browser-root'),
              tabs:pick('#gallery-category-tabs'),
              grid:pick('#gallery-grid'),
              tile:pick('.gallery-tile')
            };
          })()`;
          const result = await call('Runtime.evaluate', { expression, returnByValue: true });
          console.log(JSON.stringify(result.result.value, null, 2));
          ws.close();
          NODE

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: gallery-live-screenshot
          path: /tmp/gallery-live.png
          if-no-files-found: error
