name: Gallery Live Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate candidate Gallery layout fixes
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/gallery-debug-profile \
            --window-size=1440,1600 https://lidure22.xyz/gallery/ >/tmp/gallery-cdp.log 2>&1 &
          chrome_pid=$!
          trap 'kill $chrome_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break
            sleep 1
          done
          sleep 8
          node <<'NODE'
          const pages = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page = pages.find((p) => p.url.includes('/gallery')) || pages[0];
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          function call(method, params = {}) {
            const callId = ++id;
            return new Promise((resolve, reject) => {
              const handler = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.id !== callId) return;
                ws.removeEventListener('message', handler);
                if (msg.error) reject(new Error(JSON.stringify(msg.error)));
                else resolve(msg.result);
              };
              ws.addEventListener('message', handler);
              ws.send(JSON.stringify({ id: callId, method, params }));
            });
          }
          await call('Runtime.enable');
          async function evaluate(expression) {
            const result = await call('Runtime.evaluate', { expression, returnByValue: true });
            return result.result.value;
          }
          const snapshot = `(() => {
            const parent = document.querySelector('.standard-content');
            const shell = document.querySelector('.gallery-page-shell');
            const browser = document.querySelector('#gallery-browser-root');
            const grid = document.querySelector('#gallery-grid');
            const p = getComputedStyle(parent);
            const sr = shell.getBoundingClientRect();
            const br = browser.getBoundingClientRect();
            return {
              track: p.gridTemplateColumns,
              shellX: sr.x,
              shellWidth: sr.width,
              browserX: br.x,
              browserWidth: br.width,
              pageScrollWidth: document.documentElement.scrollWidth,
              viewportWidth: innerWidth,
              gridScrollWidth: grid.scrollWidth,
              gridClientWidth: grid.clientWidth
            };
          })()`;
          const original = await evaluate(snapshot);
          const minWidthOnly = await evaluate(`(() => {
            const shell = document.querySelector('.gallery-page-shell');
            shell.style.minWidth = '0';
            return true;
          })()`);
          await new Promise(r => setTimeout(r, 100));
          const afterMinWidth = await evaluate(snapshot);
          await evaluate(`(() => {
            const shell = document.querySelector('.gallery-page-shell');
            shell.style.minWidth = '';
            const parent = document.querySelector('.standard-content');
            parent.style.gridTemplateColumns = 'minmax(0, 1fr)';
            return true;
          })()`);
          await new Promise(r => setTimeout(r, 100));
          const afterTrackFix = await evaluate(snapshot);
          console.log(JSON.stringify({ original, afterMinWidth, afterTrackFix }, null, 2));
          ws.close();
          NODE
