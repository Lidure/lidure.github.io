name: Sekai playlist auto-name check

on:
  push:
    branches: [feat/playlist-auto-name]

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-name-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply playlist auto-name implementation
        run: python scripts/patch-sekai-playlist-auto-name.py
      - name: Run playlist auto-name regression
        run: node --test tests/sekai-playlist-auto-name.test.mjs
      - name: Run existing multi-playlist regression
        run: node --test tests/sekai-multi-playlists.test.mjs
      - name: Build site
        run: npm run build
      - name: Commit verified implementation
        run: |
          if git diff --quiet -- src/components/SekaiPlayer.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SekaiPlayer.astro
          git commit -m "feat: use remote playlist names by default [skip auto-name-ci]"
          git push
