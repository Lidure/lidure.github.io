name: Sekai playlist auto-name edge check

on:
  push:
    branches: [feat/playlist-auto-name]

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-name-edge-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/patch-sekai-playlist-generated-name.py
      - run: node --test tests/sekai-playlist-auto-name.test.mjs
      - run: node --test tests/sekai-multi-playlists.test.mjs
      - run: npm run build
      - name: Commit verified fix
        run: |
          if git diff --quiet -- src/components/SekaiPlayer.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SekaiPlayer.astro
          git commit -m "fix: upgrade generated playlist names [skip auto-name-edge-ci]"
          git push
