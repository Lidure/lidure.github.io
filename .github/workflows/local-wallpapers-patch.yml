name: Local wallpapers patch and verify

on:
  push:
    branches: [perf/localize-default-wallpapers]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/localize-default-wallpapers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Replace remote defaults with local same-origin assets
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/HeroSlideshow.astro')
          source = path.read_text()
          replacement = """const defaultImages: string[] = [
  '/assets/wallpapers/953c5e02532e4eeb9ec758e7fd7e8ad3.jpg',
  '/assets/wallpapers/miku_star.mp4',
  '/assets/wallpapers/1b87e2c5880511ebb6edd017c2d2eca2.png',
  '/assets/wallpapers/wallhaven-1p9z61.jpg',
  '/assets/wallpapers/25_1(1).png',
  '/assets/wallpapers/25_2.jpg',
  '/assets/wallpapers/shizuku.jpg',
  '/assets/wallpapers/B292469EBE40CB0DE50A866C73C61F81.jpg',
  '/assets/wallpapers/miku_ying1.mp4',
  '/assets/wallpapers/3dmiku1.mp4',
  '/assets/wallpapers/snow.mp4',
  '/assets/wallpapers/output.mp4'
];"""
          updated, count = re.subn(r"const defaultImages: string\[\] = \[[\s\S]*?\n\];", replacement, source, count=1)
          if count != 1:
              raise SystemExit('defaultImages block not found exactly once')
          if 'pub-6108779417b647c592c51538e44c8bd0.r2.dev' in updated:
              raise SystemExit('R2 development hostname still present in HeroSlideshow')
          path.write_text(updated)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify local wallpaper contract
        run: node --test tests/native-wallpaper-image.test.mjs
      - name: Run full site regression
        run: npm test
      - name: Commit local default paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HeroSlideshow.astro
          git diff --cached --quiet && exit 0
          git commit -m 'perf: serve default wallpapers from local assets'
          git push origin HEAD:perf/localize-default-wallpapers
