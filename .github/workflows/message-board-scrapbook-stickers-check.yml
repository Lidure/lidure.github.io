name: Message board scrapbook stickers regression

on:
  push:
    branches: [feat/more-scrapbook-stickers-actual]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run scrapbook sticker regression
        run: node --test tests/message-board-sticker-layout.test.mjs tests/message-board-page.test.mjs
      - name: Build site
        run: npm run build
