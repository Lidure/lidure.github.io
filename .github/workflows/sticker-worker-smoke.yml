name: Sticker Worker production smoke

on:
  push:
    branches: [feat/sticker-categories-layering-expansion]

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: danmaku-api/package-lock.json
      - name: Install Worker dependencies
        working-directory: danmaku-api
        run: npm ci
      - name: Deploy Worker
        working-directory: danmaku-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Smoke create and delete a new categorized sticker
        env:
          API_URL: https://api.lidure22.xyz/api/message-stickers
        run: |
          set -euo pipefail
          OWNER="sticker-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-abcdefghijklmnopqrstuvwxyz0123456789"
          CREATE_BODY=$(jq -nc --arg key 'kuromi-pack-01' --arg owner "$OWNER" '{stickerKey:$key,ownerToken:$owner,posX:160,posY:160}')
          CREATE_CODE=$(curl -sS -o /tmp/sticker-create.json -w '%{http_code}' \
            -X POST "$API_URL" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://lidure22.xyz' \
            --data "$CREATE_BODY")
          cat /tmp/sticker-create.json
          test "$CREATE_CODE" = '201'
          STICKER_ID=$(jq -r '.item.id // empty' /tmp/sticker-create.json)
          test -n "$STICKER_ID"
          cleanup() {
            if [ -n "${STICKER_ID:-}" ]; then
              DELETE_BODY=$(jq -nc --arg id "$STICKER_ID" --arg owner "$OWNER" '{id:$id,ownerToken:$owner}')
              curl -sS -X DELETE "$API_URL" -H 'Content-Type: application/json' -H 'Origin: https://lidure22.xyz' --data "$DELETE_BODY" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          DELETE_BODY=$(jq -nc --arg id "$STICKER_ID" --arg owner "$OWNER" '{id:$id,ownerToken:$owner}')
          DELETE_CODE=$(curl -sS -o /tmp/sticker-delete.json -w '%{http_code}' \
            -X DELETE "$API_URL" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://lidure22.xyz' \
            --data "$DELETE_BODY")
          cat /tmp/sticker-delete.json
          test "$DELETE_CODE" = '200'
          jq -e '.deleted == true' /tmp/sticker-delete.json >/dev/null
          STICKER_ID=''
