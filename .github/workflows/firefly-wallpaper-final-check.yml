name: Firefly wallpaper final check

on:
  push:
    branches: [feat/firefly-wallpaper-modes]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/firefly-wallpaper-modes.test.mjs tests/visual-settings.test.mjs tests/firefly-v3.test.mjs
      - run: npm run build
