name: Verify Moments Wide Snapshots

on:
  push:
    branches:
      - fix/moments-wide-snapshots

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Focused moments tests
        run: node --test tests/moments-journal-layout.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
