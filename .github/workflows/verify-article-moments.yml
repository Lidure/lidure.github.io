name: Verify article and moments refresh

on:
  push:
    branches:
      - feat/article-moments-human-refresh-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused contracts
        run: node --test tests/article-reading.test.mjs tests/moments-journal-layout.test.mjs

      - name: Build
        env:
          PUBLIC_MOMENTS_API: ${{ vars.PUBLIC_MOMENTS_API }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: npm run build
