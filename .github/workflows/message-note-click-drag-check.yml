name: Message note click drag check

on:
  push:
    branches: [fix/message-note-click-vs-drag]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/message-board-gesture.test.mjs tests/message-board-page.test.mjs
      - run: npm run build
