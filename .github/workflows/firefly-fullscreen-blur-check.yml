name: Firefly fullscreen blur check

on:
  push:
    branches: [fix/firefly-fullscreen-blur-state]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/firefly-fullscreen-blur-state.test.mjs tests/firefly-fullscreen-scroll.test.mjs tests/firefly-wallpaper-modes.test.mjs tests/visual-settings.test.mjs tests/fullscreen-navbar-transparency.test.mjs
      - run: npm run build
