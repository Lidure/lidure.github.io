name: Message Color Picker Remount

on:
  push:
    branches: [fix/message-color-picker-remount]

permissions:
  contents: read

jobs:
  color-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/message-board-page.test.mjs
