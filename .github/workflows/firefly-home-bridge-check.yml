name: Firefly home bridge check

on:
  push:
    branches: [feat/firefly-home-overlap-row]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run homepage bridge regression
        run: node --test tests/firefly-home-bridge.test.mjs
      - name: Build site
        run: npm run build
