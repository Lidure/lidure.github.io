name: Sticker expansion production smoke

on:
  push:
    branches: [feat/expand-message-sticker-house]

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: danmaku-api/package-lock.json
      - name: Install Worker dependencies
        working-directory: danmaku-api
        run: npm ci
      - name: Deploy Worker
        working-directory: danmaku-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Smoke create and delete a new sticker key
        run: |
          node <<'NODE'
          const endpoint = 'https://api.lidure22.xyz/api/message-stickers';
          const ownerToken = `sticker-smoke-${crypto.randomUUID()}-${crypto.randomUUID()}`;
          let id = '';
          try {
            const create = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                stickerKey: 'journal-sparkles-01',
                ownerToken,
                posX: 40,
                posY: 40,
              }),
            });
            const createText = await create.text();
            if (create.status !== 201) throw new Error(`create failed ${create.status}: ${createText}`);
            const payload = JSON.parse(createText);
            id = payload?.item?.id || '';
            if (!id || payload?.item?.stickerKey !== 'journal-sparkles-01') {
              throw new Error(`unexpected create payload: ${createText}`);
            }
            console.log(`created new sticker key successfully: ${id}`);
          } finally {
            if (id) {
              const remove = await fetch(endpoint, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, ownerToken }),
              });
              const removeText = await remove.text();
              if (!remove.ok) throw new Error(`cleanup failed ${remove.status}: ${removeText}`);
              console.log('smoke sticker removed successfully');
            }
          }
          NODE
