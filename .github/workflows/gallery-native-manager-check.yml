name: Gallery Native Manager Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify management layout in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/gallery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID ${CHROME_PID:-} 2>/dev/null || true' EXIT

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/gallery-chrome.log 2>&1 &
          CHROME_PID=$!

          cat > /tmp/gallery-browser-check.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let i = 0; i < 40; i++) {
            try {
              const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
              if (targets.some(target => target.webSocketDebuggerUrl)) break;
            } catch {}
            await sleep(250);
          }
          const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
          const target = targets.find(item => item.type === 'page' && item.webSocketDebuggerUrl);
          if (!target) throw new Error('No Chrome page target');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let seq = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const slot = pending.get(message.id);
            if (!slot) return;
            pending.delete(message.id);
            if (message.error) slot.reject(new Error(JSON.stringify(message.error)));
            else slot.resolve(message.result);
          });
          function send(method, params = {}) {
            const id = ++seq;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
          }
          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(JSON.stringify(result.exceptionDetails));
            return result.result.value;
          }
          await send('Page.enable');
          await send('Runtime.enable');
          await send('Emulation.setDeviceMetricsOverride', { width: 1440, height: 1200, deviceScaleFactor: 1, mobile: false });
          await send('Page.navigate', { url: 'http://127.0.0.1:4173/gallery/manage/' });

          for (let i = 0; i < 60; i++) {
            const ready = await evaluate(`(() => ({
              root: !!document.querySelector('#gallery-manage-root'),
              categories: document.querySelectorAll('.gallery-manage-category').length,
              cards: document.querySelectorAll('.gallery-manage-card').length
            }))()`);
            if (ready.root && ready.categories > 1 && ready.cards > 0) break;
            await sleep(250);
          }

          const probe = async label => {
            const result = await evaluate(`(() => {
              const root = document.querySelector('#gallery-manage-root');
              const layout = document.querySelector('.gallery-manage-layout');
              const grid = document.querySelector('#gallery-manage-grid');
              const actions = document.querySelector('.gallery-manage-card-actions');
              const rootRect = root?.getBoundingClientRect();
              const layoutColumns = layout ? getComputedStyle(layout).gridTemplateColumns : '';
              const gridColumns = grid ? getComputedStyle(grid).gridTemplateColumns : '';
              return {
                viewportWidth: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                rootLeft: rootRect?.left ?? -1,
                rootRight: rootRect?.right ?? -1,
                iframeCount: document.querySelectorAll('iframe').length,
                legacyOverlayCount: document.querySelectorAll('.gallery-manager-overlay').length,
                dialogCount: document.querySelectorAll('#gallery-manage-dialog').length,
                visibleDialogCount: [...document.querySelectorAll('#gallery-manage-dialog')].filter(node => !node.hidden).length,
                categoryCount: document.querySelectorAll('.gallery-manage-category').length,
                cardCount: document.querySelectorAll('.gallery-manage-card').length,
                layoutColumnCount: layoutColumns ? layoutColumns.split(/\\s+/).length : 0,
                gridColumnCount: gridColumns ? gridColumns.split(/\\s+/).length : 0,
                actionOpacity: actions ? getComputedStyle(actions).opacity : '',
              };
            })()`);
            console.log(label, JSON.stringify(result));
            if (result.scrollWidth > result.viewportWidth + 1) throw new Error(`${label}: horizontal overflow`);
            if (result.rootLeft < -1 || result.rootRight > result.viewportWidth + 1) throw new Error(`${label}: workspace outside viewport`);
            if (result.iframeCount !== 0) throw new Error(`${label}: iframe returned`);
            if (result.legacyOverlayCount !== 0) throw new Error(`${label}: legacy overlay returned`);
            if (result.dialogCount !== 1 || result.visibleDialogCount !== 0) throw new Error(`${label}: dialog foundation invalid`);
            if (result.categoryCount <= 1 || result.cardCount <= 0) throw new Error(`${label}: gallery data did not render`);
            return result;
          };

          const desktop = await probe('desktop');
          if (desktop.layoutColumnCount !== 2) throw new Error('desktop: management layout is not two-column');
          if (desktop.gridColumnCount !== 4) throw new Error('desktop: image grid is not four-column');

          await send('Emulation.setDeviceMetricsOverride', { width: 390, height: 844, deviceScaleFactor: 1, mobile: true });
          await sleep(500);
          const mobile = await probe('mobile');
          if (mobile.layoutColumnCount !== 1) throw new Error('mobile: management layout did not collapse to one column');
          if (mobile.gridColumnCount !== 2) throw new Error('mobile: image grid is not two-column');
          if (mobile.actionOpacity !== '1') throw new Error('mobile: image actions still depend on hover');
          ws.close();
          NODE

          node /tmp/gallery-browser-check.mjs
