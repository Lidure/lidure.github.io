name: Gallery Native Manager Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/gallery-manager.test.mjs tests/gallery-integration.test.mjs tests/gallery-upload-transaction.test.mjs tests/gallery-manage-core.test.mjs
