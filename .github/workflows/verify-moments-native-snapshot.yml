name: Verify Moments Native Snapshot

on:
  push:
    branches:
      - fix/moments-native-snapshot-preview

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native snapshot regression
        run: node --test tests/moments-native-snapshot-preview.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
