name: Sticker final verification

on:
  push:
    branches: [feat/sticker-categories-layering-expansion]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify 80 new local transparent PNGs
        run: |
          python -m pip install --disable-pip-version-check pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          keys = []
          for prefix, count in [
              ('kuromi-pack', 14),
              ('cinnamoroll-pack', 14),
              ('pochacco-pack', 10),
              ('nachoneko-pack', 17),
              ('nekoha-shizuku-pack', 17),
          ]:
              keys.extend(f'{prefix}-{i:02d}' for i in range(1, count + 1))
          keys.extend([
              'journal-heart-02','journal-star-02','journal-clover-02','journal-ribbon-02',
              'journal-rainbow-02','journal-flower-02','journal-leaf-02','journal-cloud-02',
          ])
          if len(keys) != 80:
              raise SystemExit(f'expected 80 new keys, got {len(keys)}')

          seen = {}
          for key in keys:
              path = Path('public/assets/message-stickers') / f'{key}.png'
              if not path.exists():
                  raise SystemExit(f'missing {path}')
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen:
                  raise SystemExit(f'duplicate new artwork: {key} == {seen[digest]}')
              seen[digest] = key
              image = Image.open(path).convert('RGBA')
              alpha = image.getchannel('A')
              ratio = sum(1 for value in alpha.getdata() if value < 250) / (image.width * image.height)
              if ratio < 0.03:
                  raise SystemExit(f'{key}: insufficient transparent pixels {ratio:.3%}')
              if image.width < 32 or image.height < 32:
                  raise SystemExit(f'{key}: too small {image.size}')
              print(f'{key}: {image.width}x{image.height}, transparent={ratio:.1%}')
          print(f'verified {len(keys)} unique transparent new PNGs')
          PY
      - name: Install site dependencies
        run: npm ci
      - name: Run 112-sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
      - name: Run full site build and regression
        run: npm test
      - name: Install Worker dependencies
        working-directory: danmaku-api
        run: npm ci
      - name: Run Worker tests
        working-directory: danmaku-api
        run: npm test
      - name: Run Worker typecheck
        working-directory: danmaku-api
        run: npm run check
