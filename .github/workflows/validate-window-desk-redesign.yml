name: Validate Window Desk Redesign

on:
  push:
    branches:
      - redesign/window-desk-tide-paper
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run foundation and regression contracts
        run: node --test tests/window-desk-foundation.test.mjs tests/visual-settings.test.mjs tests/moments-journal-layout.test.mjs
      - name: Run article TOC contracts
        run: node --test tests/article-toc.test.mjs
      - name: Build site
        run: npm run build
      - name: Diagnose homepage and rendered output contracts
        if: always()
        run: node --test --test-name-pattern="search embeds|public URLs|source configuration|optical-flow|optimized identity|rendered background" tests/site-build.test.mjs
      - name: Diagnose moments contracts
        if: always()
        run: node --test --test-name-pattern="rendered moments|moments page|moments publishing|moments video|moments browser|moment delete|moments api|moments single-item" tests/site-build.test.mjs
      - name: Diagnose media lifecycle contracts
        if: always()
        run: node --test --test-name-pattern="guestbook|hero slideshow|Astro swaps|persistent layout|layout mounts|sakura|Busuanzi|background video" tests/site-build.test.mjs
      - name: Diagnose player import contracts
        if: always()
        run: node --test --test-name-pattern="QQ playlist|online playlist" tests/site-build.test.mjs
      - name: Run full site regression suite
        if: always()
        run: npm run test:site
