name: Validate Window Desk Redesign

on:
  push:
    branches:
      - redesign/window-desk-tide-paper
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Run full site regression suite
        run: npm run test:site
