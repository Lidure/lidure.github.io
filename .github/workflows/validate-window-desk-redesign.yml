name: Validate Window Desk Redesign

on:
  push:
    branches:
      - redesign/window-desk-tide-paper
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run foundation contract
        run: node --test tests/window-desk-foundation.test.mjs
      - name: Astro check
        run: npm run check
