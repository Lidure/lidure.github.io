name: Validate Window Desk Redesign

on:
  push:
    branches:
      - redesign/window-desk-tide-paper
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run article checkpoint tests
        run: node --test tests/article-toc.test.mjs tests/article-reading.test.mjs tests/post-cover.test.mjs
      - name: Run public pages checkpoint tests
        run: node --test tests/moments-journal-layout.test.mjs tests/window-desk-public-pages.test.mjs tests/visual-settings.test.mjs tests/video-poster.test.mjs
      - name: Build site
        run: npm run build
      - name: Check Astro templates and types
        run: npm run check
      - name: Run full site regression suite
        run: npm run test:site
