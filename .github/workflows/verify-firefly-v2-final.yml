name: Verify Firefly v2 final

on:
  push:
    branches: [feat/firefly-ui-refresh-v2]
    paths-ignore:
      - '.ci/firefly-v2-final-result.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full test suite
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          {
            echo '=== npm test ==='
            npm test
            code=$?
            echo
            echo "__EXIT_CODE__=$code"
            exit "$code"
          } > .ci/firefly-v2-final-result.txt 2>&1
        continue-on-error: true
      - name: Commit verification result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/firefly-v2-final-result.txt
          git commit -m 'ci: record final Firefly v2 verification' || exit 0
          git push
