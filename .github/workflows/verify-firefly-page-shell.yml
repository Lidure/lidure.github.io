name: Verify Firefly Page Shell

on:
  push:
    branches:
      - fix/firefly-page-shell-transitions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Firefly shell regression
        run: node --test tests/firefly-page-shell-transition.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
