name: Validate Moments Sunlit V4

on:
  push:
    branches:
      - design/moments-sunlit-notes-v4

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/moments-journal-layout.test.mjs
