name: Gallery Native Check

on:
  push:
    branches:
      - codex/gallery-native-management-native

jobs:
  native-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: >-
          node --test
          tests/gallery-upload-transaction.test.mjs
          tests/gallery-image-hash.test.mjs
          tests/gallery-index-transaction.test.mjs
          tests/gallery-delete-transaction.test.mjs
          tests/gallery-manager.test.mjs
          tests/gallery-integration.test.mjs
          tests/gallery-manage-config.test.mjs
          tests/gallery-manage-model.test.mjs
