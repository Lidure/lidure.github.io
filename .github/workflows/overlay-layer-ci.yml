name: Overlay Layer Contract

on:
  push:
    branches: [fix/global-overlay-layering]

permissions:
  contents: read

jobs:
  overlay-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/overlay-layering.test.mjs
