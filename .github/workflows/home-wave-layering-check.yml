name: Homepage wave layering check

on:
  push:
    branches: [fix/home-wave-content-layering]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/home-wave-layering.test.mjs
      - run: npm run build
