name: Sticker bulk ingest

on:
  push:
    branches: [feat/sticker-categories-layering-expansion]

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sticker-categories-layering-expansion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download and verify 80 new transparent stickers
        run: |
          python <<'PY'
          from __future__ import annotations
          from io import BytesIO
          from pathlib import Path
          import hashlib
          import re
          import requests
          from PIL import Image

          OUT = Path('public/assets/message-stickers')
          OUT.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0'})

          existing_hashes = set()
          for path in OUT.glob('*.png'):
              existing_hashes.add(hashlib.sha256(path.read_bytes()).hexdigest())

          created = []

          def normalize_and_save(key: str, raw: bytes) -> bool:
              try:
                  image = Image.open(BytesIO(raw)).convert('RGBA')
              except Exception:
                  return False
              if image.width < 32 or image.height < 32:
                  return False
              alpha = image.getchannel('A')
              transparent = sum(1 for value in alpha.getdata() if value < 250)
              ratio = transparent / (image.width * image.height)
              if ratio < 0.03:
                  return False
              if max(image.size) > 512:
                  image.thumbnail((512, 512), Image.Resampling.LANCZOS)
              buffer = BytesIO()
              image.save(buffer, 'PNG', optimize=True)
              data = buffer.getvalue()
              digest = hashlib.sha256(data).hexdigest()
              if digest in existing_hashes:
                  return False
              existing_hashes.add(digest)
              target = OUT / f'{key}.png'
              target.write_bytes(data)
              created.append(key)
              print(f'{key}: {image.width}x{image.height}, transparent={ratio:.1%}, bytes={len(data)}')
              return True

          def fetch(url: str, referer: str = 'https://www.sigstick.com/') -> bytes | None:
              try:
                  response = session.get(url, timeout=25, headers={'Referer': referer})
                  if response.ok and len(response.content) > 500:
                      return response.content
              except requests.RequestException:
                  pass
              return None

          def ingest_sigstick(prefix: str, pack: str, count: int, start_index: int = 0):
              saved = 0
              for index in range(start_index, 120):
                  if saved >= count:
                      break
                  raw = None
                  for host in ('cdn.cdnstep.com', 'cdn2.cdnstep.com'):
                      raw = fetch(f'https://{host}/{pack}/{index}.thumb128.png')
                      if raw:
                          break
                  if not raw:
                      continue
                  key = f'{prefix}-{saved + 1:02d}'
                  if normalize_and_save(key, raw):
                      saved += 1
              if saved != count:
                  raise SystemExit(f'{prefix}: expected {count}, got {saved}')

          # Heavily expand the three requested Sanrio characters.
          ingest_sigstick('kuromi-pack', 'yHWLdH2iHKeLZpcA9fXE', 14)
          ingest_sigstick('cinnamoroll-pack', 'tMvS8n1yNstiBeI5x5of', 14)
          ingest_sigstick('pochacco-pack', 'g1d8xHkd5nRRtQg9tkbm', 10, start_index=8)

          # A separate Nachoneko pack avoids repeating the existing VHyK pack.
          ingest_sigstick('nachoneko-pack', 'RiUAgMEYfFbGY3pu9K0d', 17)

          # Pull transparent 猫羽雫 artwork from the dedicated Bilibili article.
          article = session.get('https://www.bilibili.com/opus/647121893650858000', timeout=30, headers={'Referer': 'https://www.bilibili.com/'}).text
          urls = []
          patterns = [
              r'https://i0\.hdslb\.com/bfs/article/[0-9a-f]+\.png',
              r'https://i0\.hdslb\.com/bfs/new_dyn/[0-9a-f]+\.png',
          ]
          for pattern in patterns:
              for url in re.findall(pattern, article):
                  if url not in urls:
                      urls.append(url)
          shizuku_saved = 0
          for url in urls:
              if shizuku_saved >= 17:
                  break
              raw = fetch(url, 'https://www.bilibili.com/')
              if not raw:
                  continue
              key = f'nekoha-shizuku-pack-{shizuku_saved + 1:02d}'
              if normalize_and_save(key, raw):
                  shizuku_saved += 1
          if shizuku_saved != 17:
              raise SystemExit(f'nekoha-shizuku: expected 17, got {shizuku_saved}; extracted URLs={len(urls)}')

          # Small hand-journal set from OpenMoji.
          journal = {
              'journal-heart-02': '2764',
              'journal-star-02': '2B50',
              'journal-clover-02': '1F340',
              'journal-ribbon-02': '1F380',
              'journal-rainbow-02': '1F308',
              'journal-flower-02': '1F33C',
              'journal-leaf-02': '1F343',
              'journal-cloud-02': '2601',
          }
          for key, code in journal.items():
              raw = fetch(f'https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/color/618x618/{code}.png', 'https://github.com/hfg-gmuend/openmoji')
              if not raw or not normalize_and_save(key, raw):
                  raise SystemExit(f'journal asset failed: {key}')

          if len(created) != 80:
              raise SystemExit(f'expected 80 created assets, got {len(created)}')
          print('created total:', len(created))
          PY
      - name: Commit local sticker assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/message-stickers/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add large categorized sticker artwork set'
          git push origin HEAD:feat/sticker-categories-layering-expansion
