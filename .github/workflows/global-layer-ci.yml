name: Global Layer Contract

on:
  pull_request:
    branches: [main]

jobs:
  layer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run global layer contract
        run: node --test tests/global-layer-system.test.mjs
