name: Global Layer Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  layer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full repository verification
        run: npm test
      - name: Run additional banner layer regressions
        run: node --test tests/firefly-banner-surface.test.mjs tests/home-wave-layering.test.mjs
