name: Global Layer Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  layer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove standard surface stacking trap
        shell: python
        run: |
          from pathlib import Path

          def replace_in_block(path, selector, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              start = text.find(selector)
              if start < 0:
                  raise SystemExit(f'{path}: selector not found: {selector!r}')
              end = text.find('}', start)
              if end < 0:
                  raise SystemExit(f'{path}: block end not found: {selector!r}')
              block = text[start:end + 1]
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {old!r} in {selector!r}, found {count}')
              block = block.replace(old, new, 1)
              file.write_text(text[:start] + block + text[end + 1:], encoding='utf-8')

          replace_in_block('src/styles/firefly-refresh.css', '.standard-page-surface {', 'z-index: 3;', 'z-index: auto;')
          replace_in_block(
              'src/components/BlogBanner.astro',
              'html[data-wallpaper-mode="banner"] body.layout-standard .standard-page-surface {',
              'z-index: 3;',
              'z-index: auto;',
          )
      - name: Verify stacking-context diff
        run: |
          git diff --check
          git diff -- src/styles/firefly-refresh.css src/components/BlogBanner.astro
      - name: Commit stacking-context fix
        run: |
          if git diff --quiet; then
            echo 'No stacking-context changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/firefly-refresh.css src/components/BlogBanner.astro
          git commit -m 'fix: let page overlays escape content stacking context'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Run global layer contract
        run: node --test tests/global-layer-system.test.mjs
      - name: Run adjacent interaction and banner tests
        run: >-
          node --test
          tests/message-board-page.test.mjs
          tests/message-board-layout.test.mjs
          tests/message-board-gesture.test.mjs
          tests/sekai-player-search.test.mjs
          tests/visual-settings.test.mjs
          tests/banner-waves.test.mjs
          tests/fullscreen-navbar-top.test.mjs
          tests/firefly-banner-surface.test.mjs
          tests/home-wave-layering.test.mjs
