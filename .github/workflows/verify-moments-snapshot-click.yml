name: Verify Moments Snapshot Click

on:
  push:
    branches:
      - fix/moments-snapshot-click

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Snapshot click regression
        run: node --test tests/moments-snapshot-fallback.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
