name: Gallery Entry Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Gallery action alignment and management entry in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/gallery-entry-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID ${CHROME_PID:-} 2>/dev/null || true' EXIT

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/gallery-entry-chrome.log 2>&1 &
          CHROME_PID=$!

          cat > /tmp/gallery-entry-check.mjs <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let i = 0; i < 40; i++) {
            try {
              const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
              if (targets.some(target => target.webSocketDebuggerUrl)) break;
            } catch {}
            await sleep(250);
          }

          const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
          const target = targets.find(item => item.type === 'page' && item.webSocketDebuggerUrl);
          if (!target) throw new Error('No Chrome page target');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let seq = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const slot = pending.get(message.id);
            if (!slot) return;
            pending.delete(message.id);
            if (message.error) slot.reject(new Error(JSON.stringify(message.error)));
            else slot.resolve(message.result);
          });

          function send(method, params = {}) {
            const id = ++seq;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
          }

          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(JSON.stringify(result.exceptionDetails));
            return result.result.value;
          }

          async function navigate(url) {
            await send('Page.navigate', { url });
            await sleep(650);
          }

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Emulation.setDeviceMetricsOverride', { width: 1600, height: 900, deviceScaleFactor: 1, mobile: false });

          await navigate('http://127.0.0.1:4173/gallery/');
          const publicEntry = await evaluate(`(() => {
            const link = document.querySelector('.gallery-manage-link');
            if (!link) return null;
            const rect = link.getBoundingClientRect();
            return {
              text: link.textContent.trim(),
              href: link.getAttribute('href'),
              visible: rect.width > 0 && rect.height > 0 && getComputedStyle(link).display !== 'none',
            };
          })()`);
          console.log('public-entry', JSON.stringify(publicEntry));
          if (!publicEntry?.visible || publicEntry.text !== '图库管理' || publicEntry.href !== '/gallery/manage') {
            throw new Error('public Gallery management entry is missing or not visible');
          }

          await navigate('http://127.0.0.1:4173/gallery/manage/');
          const alignment = await evaluate(`(() => [...document.querySelectorAll('.gallery-manage-hero-actions .gallery-manage-button')].map(button => {
            const buttonRect = button.getBoundingClientRect();
            const range = document.createRange();
            range.selectNodeContents(button);
            const textRect = range.getBoundingClientRect();
            const buttonCenter = buttonRect.top + buttonRect.height / 2;
            const textCenter = textRect.top + textRect.height / 2;
            return {
              text: button.textContent.trim(),
              display: getComputedStyle(button).display,
              delta: Math.abs(buttonCenter - textCenter),
            };
          }))()`);
          console.log('manage-alignment', JSON.stringify(alignment));
          if (alignment.length !== 3) throw new Error('expected three management hero actions');
          if (alignment.some(item => item.display !== 'flex' && item.display !== 'inline-flex')) throw new Error('management actions are not flex-centered');
          if (alignment.some(item => item.delta > 1.5)) throw new Error('management action text is not vertically centered');

          ws.close();
          NODE

          node /tmp/gallery-entry-check.mjs
