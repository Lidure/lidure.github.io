name: Admin note position regression

on:
  push:
    branches: [fix/admin-note-position-reset]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: danmaku-api/package-lock.json
      - name: Install API dependencies
        working-directory: danmaku-api
        run: npm ci
      - name: Run message API regression
        working-directory: danmaku-api
        run: npm test -- messages.test.ts
      - name: Check API types
        working-directory: danmaku-api
        run: npm run check
      - name: Install site dependencies
        run: npm ci
      - name: Build site
        run: npm run build
