name: Blog PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/lib/gallery-manage-controller.mjs
          node --check src/lib/gallery-move-transaction.mjs
      - name: Build Astro site
        run: npm run build
      - name: Site regression tests
        run: npm run test:site
