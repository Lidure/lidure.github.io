name: Sticker controller patch

on:
  push:
    branches: [feat/sticker-categories-layering-expansion]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sticker-categories-layering-expansion
      - name: Patch sticker category controls
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/lib/message-sticker-controller.ts')
          s = p.read_text()
          s = s.replace("import { MESSAGE_STICKER_BY_KEY, MESSAGE_STICKER_CATALOG, type MessageStickerDefinition } from './message-sticker-catalog';", "import { MESSAGE_STICKER_BY_KEY, MESSAGE_STICKER_CATALOG, type MessageStickerCategory, type MessageStickerDefinition } from './message-sticker-catalog';")
          category_lines = ["", "type StickerCategoryFilter = 'all' | MessageStickerCategory;", "", "const STICKER_CATEGORIES: readonly { key: StickerCategoryFilter; label: string }[] = [", "  { key: 'all', label: '全部' },", "  { key: 'sanrio', label: '三丽鸥' },", "  { key: 'nekoha-shizuku', label: '猫羽雫' },", "  { key: 'nachoneko', label: '甘城猫猫' },", "  { key: 'journal', label: '手账' },", "];", ""]
          s = s.replace("const OWNER_STICKER_LIMIT = 5;\n", "const OWNER_STICKER_LIMIT = 5;\n" + "\n".join(category_lines))
          s = s.replace("  const grid = byId<HTMLElement>('message-sticker-grid')!;\n  const quota = byId<HTMLElement>('message-sticker-quota')!;", "  const grid = byId<HTMLElement>('message-sticker-grid')!;\n  const categories = byId<HTMLElement>('message-sticker-categories')!;\n  const quota = byId<HTMLElement>('message-sticker-quota')!;")
          s = s.replace("  if (!root || !stage || !viewport || !openButton || !panel || !grid || !quota || !placementBar) return () => {};", "  if (!root || !stage || !viewport || !openButton || !panel || !grid || !categories || !quota || !placementBar) return () => {};")
          s = s.replace("  let adminMode = false;\n  let placingStickerKey = '';", "  let adminMode = false;\n  let activeStickerCategory: StickerCategoryFilter = 'all';\n  let placingStickerKey = '';")
          start = s.index('  function buildStickerChoices() {')
          end = s.index('\n  function createActionMenu', start)
          lines = [
            "  function buildStickerCategories() {",
            "    categories.replaceChildren();",
            "    STICKER_CATEGORIES.forEach(({ key, label }) => {",
            "      const button = document.createElement('button');",
            "      button.type = 'button';",
            "      button.className = 'message-sticker-category';",
            "      button.dataset.stickerCategory = key;",
            "      button.setAttribute('role', 'tab');",
            "      button.setAttribute('aria-selected', String(activeStickerCategory === key));",
            "      const count = key === 'all'",
            "        ? MESSAGE_STICKER_CATALOG.length",
            "        : MESSAGE_STICKER_CATALOG.filter((definition) => definition.category === key).length;",
            "      button.append(document.createTextNode(label));",
            "      const badge = document.createElement('span');",
            "      badge.className = 'message-sticker-category-count';",
            "      badge.textContent = String(count);",
            "      button.appendChild(badge);",
            "      button.addEventListener('click', () => {",
            "        if (activeStickerCategory === key) return;",
            "        activeStickerCategory = key;",
            "        buildStickerCategories();",
            "        buildStickerChoices();",
            "      }, { signal });",
            "      categories.appendChild(button);",
            "    });",
            "  }",
            "",
            "  function buildStickerChoices() {",
            "    grid.replaceChildren();",
            "    const visibleDefinitions = activeStickerCategory === 'all'",
            "      ? MESSAGE_STICKER_CATALOG",
            "      : MESSAGE_STICKER_CATALOG.filter((definition) => definition.category === activeStickerCategory);",
            "    visibleDefinitions.forEach((definition) => {",
            "      const button = document.createElement('button');",
            "      button.type = 'button';",
            "      button.className = 'message-sticker-choice';",
            "      button.dataset.stickerChoice = definition.key;",
            "      button.setAttribute('aria-label', `选择${definition.character}贴纸：${definition.label}`);",
            "      const image = makeImage(definition, button);",
            "      const label = document.createElement('span');",
            "      label.textContent = definition.character;",
            "      const note = document.createElement('small');",
            "      note.textContent = definition.label;",
            "      label.appendChild(note);",
            "      button.append(image, label);",
            "      button.addEventListener('click', () => {",
            "        if (button.disabled) return;",
            "        startPlacement(definition.key);",
            "      }, { signal });",
            "      grid.appendChild(button);",
            "    });",
            "    updateQuotaUi();",
            "  }",
          ]
          s = s[:start] + "\n".join(lines) + s[end:]
          s = s.replace("  buildStickerChoices();\n  ensureStickerLayer();", "  buildStickerCategories();\n  buildStickerChoices();\n  ensureStickerLayer();")
          p.write_text(s)
          PY
      - name: Commit controller
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/message-sticker-controller.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: filter sticker house by category'
          git push origin HEAD:feat/sticker-categories-layering-expansion
