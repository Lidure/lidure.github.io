name: Verify Sayori TOC

on:
  push:
    branches:
      - refactor/sayori-toc-exact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Focused article contract
        run: node --test tests/article-reading.test.mjs
      - name: Full test suite
        env:
          PUBLIC_MOMENTS_API: ${{ vars.PUBLIC_MOMENTS_API }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: npm test
      - name: Astro check
        run: npx astro check
      - name: Build
        env:
          PUBLIC_MOMENTS_API: ${{ vars.PUBLIC_MOMENTS_API }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: npm run build

# Temporary branch-only verification for the exact Sayori CardTOC port.
