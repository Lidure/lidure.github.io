name: Verify TOC Single Number

on:
  push:
    branches:
      - fix/toc-duplicate-numbering

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Article TOC tests
        run: node --test tests/article-reading.test.mjs tests/article-scroll-performance.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
