name: My Melody alpha hotfix check

on:
  push:
    branches: [fix/my-melody-transparent-pixels]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full site regression and build
        run: npm test
      - name: Run sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
      - name: Install PNG decoder
        run: npm install --no-save --package-lock=false pngjs@7.0.0
      - name: Verify real transparent background pixels
        run: |
          node <<'NODE'
          const fs = await import('node:fs/promises');
          const { PNG } = await import('pngjs');
          const source = await fs.readFile('src/lib/message-sticker-catalog.ts', 'utf8');
          const urls = [...source.matchAll(/imageUrl:\s*'([^']+)'/g)].map((m) => m[1]);
          if (urls.length !== 12) throw new Error(`expected 12 assets, got ${urls.length}`);
          const failures = [];
          for (const url of urls) {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: { 'User-Agent': 'Mozilla/5.0 sticker-pixel-alpha-check' },
            });
            if (!response.ok) {
              failures.push(`${url}: HTTP ${response.status}`);
              continue;
            }
            const png = PNG.sync.read(Buffer.from(await response.arrayBuffer()));
            let transparent = 0;
            for (let i = 3; i < png.data.length; i += 4) if (png.data[i] < 250) transparent += 1;
            const ratio = transparent / (png.width * png.height);
            const corners = [3, (png.width - 1) * 4 + 3, ((png.height - 1) * png.width) * 4 + 3, ((png.height * png.width) - 1) * 4 + 3];
            const transparentCorners = corners.filter((i) => png.data[i] < 250).length;
            console.log(`${(ratio * 100).toFixed(1)}% transparent, corners ${transparentCorners}/4: ${url}`);
            if (ratio < 0.05 || transparentCorners < 3) failures.push(url);
          }
          if (failures.length) throw new Error(`non-transparent sticker assets: ${failures.join(', ')}`);
          NODE
