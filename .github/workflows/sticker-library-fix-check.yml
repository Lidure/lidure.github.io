name: Sticker library fix check

on:
  push:
    branches: [fix/message-sticker-transparency]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Worker dependencies
        working-directory: danmaku-api
        run: npm ci
      - name: Run sticker contract
        run: node --test tests/message-board-public-stickers.test.mjs
      - name: Run Worker tests
        working-directory: danmaku-api
        run: npm test
      - name: Check Worker types
        working-directory: danmaku-api
        run: npm run check
