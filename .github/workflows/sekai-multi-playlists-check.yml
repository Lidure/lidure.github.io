name: Sekai multi-playlist check

on:
  push:
    branches: [feat/multi-import-playlists]

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip multi-playlist-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair temporary patcher quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-sekai-multi-playlists.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("sourceUrl: s.sourceUrl || '' ''',", "sourceUrl: s.sourceUrl || ''' ,")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply multi-playlist implementation
        run: python scripts/patch-sekai-multi-playlists.py
      - name: Run multi-playlist regression
        run: node --test tests/sekai-multi-playlists.test.mjs
      - name: Build site
        run: npm run build
      - name: Commit verified implementation
        run: |
          if git diff --quiet -- src/components/SekaiPlayer.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SekaiPlayer.astro
          git commit -m "feat: support multiple imported playlists [skip multi-playlist-ci]"
          git push
