name: Gallery Layout Fix Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full test suite
        env:
          PUBLIC_MOMENTS_API: https://api.lidure22.xyz/api
          PUBLIC_MEDIA_BASE_URL: https://api.lidure22.xyz/media
        run: npm test
      - name: Verify built Gallery stays inside viewport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/gallery-server.log 2>&1 &
          server_pid=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/gallery-fix-profile \
            --window-size=1440,1600 http://127.0.0.1:4173/gallery/ >/tmp/gallery-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill $chrome_pid $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json && break
            sleep 1
          done
          sleep 8
          node <<'NODE'
          const pages = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page = pages.find((p) => p.url.includes('/gallery')) || pages[0];
          if (!page?.webSocketDebuggerUrl) throw new Error('No Gallery page in Chrome');
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          function call(method, params = {}) {
            const callId = ++id;
            return new Promise((resolve, reject) => {
              const handler = (event) => {
                const message = JSON.parse(event.data);
                if (message.id !== callId) return;
                ws.removeEventListener('message', handler);
                if (message.error) reject(new Error(JSON.stringify(message.error)));
                else resolve(message.result);
              };
              ws.addEventListener('message', handler);
              ws.send(JSON.stringify({ id: callId, method, params }));
            });
          }
          await call('Runtime.enable');
          const result = await call('Runtime.evaluate', {
            expression: `(() => {
              const shell = document.querySelector('.gallery-page-shell');
              const browser = document.querySelector('#gallery-browser-root');
              const parent = document.querySelector('.standard-content');
              if (!shell || !browser || !parent) return { missing: true };
              const shellRect = shell.getBoundingClientRect();
              const browserRect = browser.getBoundingClientRect();
              return {
                missing: false,
                viewportWidth: innerWidth,
                pageScrollWidth: document.documentElement.scrollWidth,
                parentTrack: getComputedStyle(parent).gridTemplateColumns,
                shellLeft: shellRect.left,
                shellRight: shellRect.right,
                browserLeft: browserRect.left,
                browserRight: browserRect.right,
                categoryCount: document.querySelectorAll('.gallery-category-tab').length,
              };
            })()`,
            returnByValue: true,
          });
          const value = result.result.value;
          console.log(JSON.stringify(value, null, 2));
          if (value.missing) throw new Error('Gallery structure is missing');
          if (value.shellLeft < 0 || value.shellRight > value.viewportWidth + 1) {
            throw new Error(`Gallery shell is outside viewport: ${JSON.stringify(value)}`);
          }
          if (value.pageScrollWidth > value.viewportWidth + 1) {
            throw new Error(`Gallery creates horizontal page overflow: ${JSON.stringify(value)}`);
          }
          if (value.categoryCount < 1) throw new Error('Gallery categories did not load');
          ws.close();
          NODE
