name: tmp-admin-password-compat

on:
  push:
    branches:
      - fix/admin-password-hash-compat

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: danmaku-api/package-lock.json
      - run: npm ci
        working-directory: danmaku-api
      - name: Apply compatibility fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('danmaku-api/src/auth.ts')
          text = path.read_text()
          text = text.replace(
              'const PASSWORD_ITERATIONS = 100000;',
              'const PASSWORD_ITERATIONS = new Set([100000, 310000]);'
          )
          text = text.replace(
              '''  const [prefix, hashName, iterationsRaw, saltRaw, hashRaw] = parts;\n\n  if (\n    prefix !== PASSWORD_PREFIX ||\n    hashName !== PASSWORD_HASH ||\n    iterationsRaw !== String(PASSWORD_ITERATIONS)\n  ) {\n    return null;\n  }''',
              '''  const [prefix, hashName, iterationsRaw, saltRaw, hashRaw] = parts;\n  const iterations = Number(iterationsRaw);\n\n  if (\n    prefix !== PASSWORD_PREFIX ||\n    hashName !== PASSWORD_HASH ||\n    !Number.isSafeInteger(iterations) ||\n    !PASSWORD_ITERATIONS.has(iterations)\n  ) {\n    return null;\n  }'''
          )
          text = text.replace(
              '  return { iterations: PASSWORD_ITERATIONS, salt, hash };',
              '  return { iterations, salt, hash };'
          )
          path.write_text(text)
      - name: Commit compatibility fix
        run: |
          if git diff --quiet -- danmaku-api/src/auth.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add danmaku-api/src/auth.ts
          git commit -m "fix: support legacy and current admin password hashes"
          git push
      - run: npx vitest run tests/auth-password-compat.test.ts
        working-directory: danmaku-api
