name: PR Firefly wallpaper test

on:
  push:
    branches: [codex/firefly-wallpaper-loading]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/firefly-wallpaper-loading.test.mjs
