name: V3 Task3 Exact Patch

on:
  push:
    branches:
      - feat/firefly-banner-covers-music
    paths:
      - .github/workflows/v3-task3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/firefly-banner-covers-music
          fetch-depth: 0

      - name: Apply Task 3 exact transforms
        run: |
          python - <<'PY'
          from pathlib import Path

          layout_path = Path('src/layouts/BaseLayout.astro')
          layout = layout_path.read_text(encoding='utf-8')
          old = "const isStandard = layoutMode === 'standard';\nconst resolvedBannerTitle"
          new = "const isStandard = layoutMode === 'standard';\nconst isHome = normalizedPath === '';\nconst resolvedBannerTitle"
          if old not in layout:
              raise SystemExit('BaseLayout isStandard anchor not found')
          layout = layout.replace(old, new, 1)
          old_body = '<body class={`layout-${layoutMode}`}>'
          new_body = '<body class:list={[`layout-${layoutMode}`, { \'is-home\': isHome }]}>'
          if old_body not in layout:
              raise SystemExit('BaseLayout body anchor not found')
          layout = layout.replace(old_body, new_body, 1)
          layout_path.write_text(layout, encoding='utf-8')

          css_path = Path('src/styles/firefly-refresh.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = [
              ('  --blog-banner-height: 50vh;\n', '  --blog-banner-height: 62vh;\n  --blog-banner-overlap: 56px;\n'),
              ('  height: var(--blog-banner-height, 50vh);\n', '  height: var(--blog-banner-height, 62vh);\n  min-height: 360px;\n'),
              ('body.layout-standard .slideshow-overlay {\n  background: rgba(0, 0, 0, 0.26);\n}', 'body.layout-standard .slideshow-overlay {\n  background: rgba(0, 0, 0, var(--slideshow-overlay, var(--wallpaper-overlay, 0.45)));\n}'),
              ('  min-height: 320px;\n', '  min-height: 360px;\n', 1),
              ('  width: min(760px, 92vw);\n', '  width: min(1380px, calc(100vw - 48px));\n'),
              ('  margin-top: -28px;\n', '  margin-top: calc(-1 * var(--blog-banner-overlap, 56px));\n'),
              ('    --blog-banner-height: 36vh;\n', '    --blog-banner-height: 42vh;\n    --blog-banner-overlap: 28px;\n'),
              ('    margin-top: -22px;\n', '    margin-top: calc(-1 * var(--blog-banner-overlap, 28px));\n'),
          ]
          for entry in replacements:
              if len(entry) == 2:
                  old_text, new_text = entry
                  count = 1
              else:
                  old_text, new_text, count = entry
              if old_text not in css:
                  raise SystemExit(f'firefly-refresh anchor not found: {old_text[:80]!r}')
              css = css.replace(old_text, new_text, count)

          subtitle_anchor = ".blog-banner-copy p {\n  margin: 12px 0 0;"
          subtitle_new = ".blog-banner-copy p {\n  max-width: 820px;\n  margin: 12px auto 0;"
          if subtitle_anchor not in css:
              raise SystemExit('banner subtitle anchor not found')
          css = css.replace(subtitle_anchor, subtitle_new, 1)

          tablet_block = '''\n@media (max-width: 1024px) and (min-width: 721px) {\n  body.layout-standard {\n    --blog-banner-height: 54vh;\n    --blog-banner-overlap: 44px;\n  }\n\n  body.layout-standard .hero-slideshow,\n  .blog-banner {\n    min-height: 320px;\n  }\n}\n\n'''
          mobile_anchor = '@media (max-width: 720px) {'
          if mobile_anchor not in css:
              raise SystemExit('mobile media anchor not found')
          css = css.replace(mobile_anchor, tablet_block + mobile_anchor, 1)

          v3_block = '''\n\n/* Firefly v3 wallpaper presentation */\nhtml[data-banner-title="false"] body.layout-standard .blog-banner-copy {\n  visibility: hidden;\n}\n\nhtml[data-banner-gradient="true"] body.layout-standard .standard-page-surface::before {\n  content: '';\n  position: absolute;\n  left: 0;\n  right: 0;\n  top: -110px;\n  height: 110px;\n  pointer-events: none;\n  background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--standard-page-bg) 36%, transparent) 48%, var(--standard-page-bg) 100%);\n}\n\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .hero-slideshow {\n  position: fixed;\n  inset: 0;\n  width: 100%;\n  height: 100vh;\n  min-height: 100vh;\n  filter: blur(var(--wallpaper-blur, 6px));\n  transform: scale(1.025);\n  transform-origin: center;\n}\n\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard.is-home .blog-banner {\n  height: 100vh;\n  min-height: 100vh;\n}\n\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard.is-home .standard-page-surface {\n  margin-top: 0;\n  background: color-mix(in srgb, var(--standard-page-bg) 70%, transparent);\n}\n\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard:not(.is-home) .blog-banner {\n  display: none;\n}\n\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard:not(.is-home) .standard-page-surface {\n  margin-top: 64px;\n  background: color-mix(in srgb, var(--standard-page-bg) 70%, transparent);\n}\n\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .standard-page-surface::before {\n  display: none;\n}\n\nhtml.no-hero-bg[data-wallpaper-mode="fullscreen"] body.layout-standard .standard-page-surface {\n  background: var(--standard-page-bg);\n}\n'''
          css = css.rstrip() + v3_block + '\n'
          css_path.write_text(css, encoding='utf-8')

          v2_path = Path('src/styles/firefly-v2.css')
          v2 = v2_path.read_text(encoding='utf-8')
          dark_old = '  --standard-accent: #f078a8;\n  --standard-accent-soft: rgba(240, 120, 168, 0.13);'
          dark_new = '  --standard-accent: hsl(var(--theme-hue, 340) 78% 69%);\n  --standard-accent-soft: hsl(var(--theme-hue, 340) 78% 69% / 0.13);'
          light_old = '  --standard-accent: #d95f91;\n  --standard-accent-soft: rgba(217, 95, 145, 0.11);'
          light_new = '  --standard-accent: hsl(var(--theme-hue, 340) 58% 50%);\n  --standard-accent-soft: hsl(var(--theme-hue, 340) 58% 50% / 0.11);'
          for old_text, new_text in ((dark_old, dark_new), (light_old, light_new)):
              if old_text not in v2:
                  raise SystemExit('firefly-v2 accent anchor not found')
              v2 = v2.replace(old_text, new_text, 1)

          v2_block = '''\n\n/* Firefly v3 wallpaper-aware card layer */\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .sidebar-widget,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .home-post-card,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .card,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .archive-shell,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .post-shell,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .timeline-item,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .project-card,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .message-form,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .message-card,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .publish-panel,\nhtml[data-wallpaper-mode="fullscreen"] body.layout-standard .moment-card {\n  background: color-mix(in srgb, var(--standard-card-bg) var(--card-opacity-percent, 92%), transparent);\n  backdrop-filter: blur(14px);\n  -webkit-backdrop-filter: blur(14px);\n}\n\nhtml[data-card-border="false"] body.layout-standard .sidebar-widget,\nhtml[data-card-border="false"] body.layout-standard .home-post-card,\nhtml[data-card-border="false"] body.layout-standard .card,\nhtml[data-card-border="false"] body.layout-standard .archive-shell,\nhtml[data-card-border="false"] body.layout-standard .post-shell,\nhtml[data-card-border="false"] body.layout-standard .timeline-item,\nhtml[data-card-border="false"] body.layout-standard .project-card {\n  border-color: transparent;\n}\n\nhtml[data-card-border="true"][data-card-follow-theme="true"] body.layout-standard .sidebar-widget,\nhtml[data-card-border="true"][data-card-follow-theme="true"] body.layout-standard .home-post-card,\nhtml[data-card-border="true"][data-card-follow-theme="true"] body.layout-standard .card,\nhtml[data-card-border="true"][data-card-follow-theme="true"] body.layout-standard .archive-shell,\nhtml[data-card-border="true"][data-card-follow-theme="true"] body.layout-standard .post-shell {\n  border-color: color-mix(in srgb, var(--standard-accent) 22%, var(--standard-line));\n}\n'''
          v2 = v2.rstrip() + v2_block + '\n'
          v2_path.write_text(v2, encoding='utf-8')

          test_path = Path('tests/firefly-ui-refresh.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          old_test = '''test('standard banner keeps B3 desktop and mobile heights', () => {\n  const css = readSource('src/styles/firefly-refresh.css');\n  assert.match(css, /--blog-banner-height:\\s*50vh/);\n  assert.match(css, /--blog-banner-height:\\s*36vh/);\n  assert.match(css, /body\\.layout-standard/);\n  assert.doesNotMatch(css, /body\\.layout-immersive\\s+\\.post-card/);\n});'''
          new_test = '''test('standard banner keeps approved v3 desktop and mobile heights', () => {\n  const css = readSource('src/styles/firefly-refresh.css');\n  assert.match(css, /--blog-banner-height:\\s*62vh/);\n  assert.match(css, /--blog-banner-height:\\s*42vh/);\n  assert.match(css, /body\\.layout-standard/);\n  assert.doesNotMatch(css, /body\\.layout-immersive\\s+\\.post-card/);\n});'''
          if old_test not in test:
              raise SystemExit('old banner regression test anchor not found')
          test = test.replace(old_test, new_test, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          grep -q -- '--blog-banner-height: 62vh' src/styles/firefly-refresh.css
          grep -q 'body.layout-standard.is-home' src/styles/firefly-refresh.css
          grep -q 'body.layout-standard:not(.is-home)' src/styles/firefly-refresh.css
          grep -q -- '--standard-accent: hsl(var(--theme-hue, 340)' src/styles/firefly-v2.css
          grep -q "'is-home': isHome" src/layouts/BaseLayout.astro

      - name: Install dependencies
        run: npm ci

      - name: Verify Task 3
        env:
          PUBLIC_MOMENTS_API: ${{ vars.PUBLIC_MOMENTS_API }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: npm test

      - name: Commit Task 3 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/BaseLayout.astro src/styles/firefly-refresh.css src/styles/firefly-v2.css tests/firefly-ui-refresh.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: add banner and fullscreen wallpaper modes"
          git push origin HEAD:feat/firefly-banner-covers-music
